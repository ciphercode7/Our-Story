<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Our Story ❤️</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="login-page">

    <!-- Animated Background -->

    <div class="stars"></div>

    <div class="moon"></div>



    <!-- Main Card -->

    <div class="container">

        <h3 class="smallTitle">

            ✨ A Little Secret ✨

        </h3>



        <h1 id="typing"></h1>



        <p class="description">

            Only one person knows the password
            to this little world.

        </p>



        <div id="loginBox">

            <input

                type="password"

                id="password"

                placeholder="Enter the Secret Password"

            >



            <button onclick="checkPassword()">

                Unlock Our Story ❤️

            </button>



            <p id="error"></p>

        </div>

    </div>



    <script src="login.js"></script>

</body>

</html>
